<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Employee Task Management</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <!-- ========================================
                 BRAND
            ======================================== -->

            <div class="login-brand">

                <div class="login-brand-logo">
                    ETM
                </div>

                <h2>
                    Employee Task Management
                </h2>

            </div>


            <!-- ========================================
                 LOGIN HEADER
            ======================================== -->

            <div class="login-header">

                <h1 id="loginTitle">
                    Login
                </h1>

                <p id="loginDescription">
                    Sign in to continue.
                </p>

            </div>


            <!-- ========================================
                 LOGIN FORM
            ======================================== -->

            <form
                id="loginForm"
                novalidate
            >

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-input-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePasswordButton"
                            class="password-toggle"
                            aria-label="Show password"
                        >

                            <!-- Eye Open -->

                            <svg
                                class="password-eye-icon eye-open"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>

                            </svg>


                            <!-- Eye Closed -->

                            <svg
                                class="password-eye-icon eye-closed"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >

                                <path
                                    d="M3 3l18 18"
                                ></path>

                                <path
                                    d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                                ></path>

                                <path
                                    d="M9.9 4.2A11.8 11.8 0 0 1 12 4c6.5 0 10 6 10 6a18.5 18.5 0 0 1-3.1 3.8"
                                ></path>

                                <path
                                    d="M6.2 6.2C3.6 8.1 2 10 2 10s3.5 6 10 6c1.3 0 2.5-.2 3.6-.6"
                                ></path>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- ========================================
                     FORGOT PASSWORD
                ======================================== -->

                <div class="forgot-password-container">

                    <button
                        type="button"
                        id="forgotPasswordButton"
                        class="forgot-password-link"
                    >
                        Forgot Password?
                    </button>

                </div>


                <!-- ========================================
                     LOGIN BUTTON
                ======================================== -->

                <button
                    type="submit"
                    id="loginButton"
                    class="btn-primary"
                >
                    Login
                </button>


                <!-- ========================================
                     LOGIN MESSAGE
                ======================================== -->

                <p
                    id="loginMessage"
                    class="form-message"
                    aria-live="polite"
                ></p>

            </form>


            <!-- ========================================
                 FOOTER
            ======================================== -->

            <div class="login-footer">

                <button
                    type="button"
                    id="backButton"
                    class="btn-secondary"
                >
                    Back
                </button>

            </div>

        </div>

    </main>


    <!-- ========================================
         LOGIN JAVASCRIPT
    ======================================== -->

    <script src="./login.js"></script>

</body>

</html>
