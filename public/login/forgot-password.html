<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | Employee Task Management</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <main class="login-page">

        <div class="login-card">

            <!-- ========================================
                 BRAND
            ========================================= -->

            <div class="login-brand">

                <div class="login-brand-logo">
                    ETM
                </div>

                <h2>
                    Employee Task Management
                </h2>

            </div>


            <!-- ========================================
                 STEP 1
                 ENTER EMAIL
            ========================================= -->

            <section
                id="resetEmailStep"
            >

                <div class="login-header">

                    <h1 id="resetEmailTitle">
                        Forgot Password
                    </h1>

                    <p id="resetEmailDescription">
                        Enter your account email to begin password recovery.
                    </p>

                </div>


                <form
                    id="resetEmailForm"
                    novalidate
                >

                    <div class="form-group">

                        <label for="resetEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="resetEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        id="requestResetButton"
                        class="btn-primary"
                    >
                        Send Reset Code
                    </button>


                    <p
                        id="resetEmailMessage"
                        class="form-message"
                        aria-live="polite"
                    ></p>

                </form>

            </section>


            <!-- ========================================
                 STEP 2
                 VERIFY CODE
            ========================================= -->

            <section
                id="resetCodeStep"
                hidden
            >

                <div class="login-header">

                    <h1>
                        Enter Reset Code
                    </h1>

                    <p>
                        Enter the verification code sent to your recovery email.
                    </p>

                </div>


                <form
                    id="resetCodeForm"
                    novalidate
                >

                    <div class="form-group">

                        <label for="resetCode">
                            Verification Code
                        </label>

                        <input
                            type="text"
                            id="resetCode"
                            name="verification_code"
                            placeholder="Enter 6-digit code"
                            inputmode="numeric"
                            maxlength="6"
                            autocomplete="one-time-code"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        id="verifyResetCodeButton"
                        class="btn-primary"
                    >
                        Verify Code
                    </button>


                    <p
                        id="resetCodeMessage"
                        class="form-message"
                        aria-live="polite"
                    ></p>


                    <div class="login-footer">

                        <button
                            type="button"
                            id="resendResetCodeButton"
                            class="btn-secondary"
                        >
                            Resend Code
                        </button>

                        <p
                            id="resendResetMessage"
                            class="form-message"
                            aria-live="polite"
                        ></p>

                        <button
                            type="button"
                            id="cancelResetButton"
                            class="btn-secondary"
                        >
                            Back
                        </button>

                    </div>

                </form>

            </section>


            <!-- ========================================
                 STEP 3
                 CREATE NEW PASSWORD
            ========================================= -->

            <section
                id="resetPasswordStep"
                hidden
            >

                <div class="login-header">

                    <h1>
                        Create New Password
                    </h1>

                    <p>
                        Enter and confirm your new password.
                    </p>

                </div>


                <form
                    id="resetPasswordForm"
                    novalidate
                >

                    <!-- NEW PASSWORD -->

                    <div class="form-group">

                        <label for="newResetPassword">
                            New Password
                        </label>

                        <div class="password-input-container">

                            <input
                                type="password"
                                id="newResetPassword"
                                name="new_password"
                                placeholder="Enter new password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                id="toggleNewResetPassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >

                                <svg
                                    class="password-eye-icon eye-open"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                    ></path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    ></circle>

                                </svg>


                                <svg
                                    class="password-eye-icon eye-closed"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M3 3l18 18"
                                    ></path>

                                    <path
                                        d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                                    ></path>

                                    <path
                                        d="M9.9 4.2A11.8 11.8 0 0 1 12 4c6.5 0 10 6 10 6a18.5 18.5 0 0 1-3.1 3.8"
                                    ></path>

                                    <path
                                        d="M6.2 6.2C3.6 8.1 2 10 2 10s3.5 6 10 6c1.3 0 2.5-.2 3.6-.6"
                                    ></path>

                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmResetPassword">
                            Confirm Password
                        </label>

                        <div class="password-input-container">

                            <input
                                type="password"
                                id="confirmResetPassword"
                                name="confirm_password"
                                placeholder="Confirm new password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                id="toggleConfirmResetPassword"
                                class="password-toggle"
                                aria-label="Show password"
                            >

                                <svg
                                    class="password-eye-icon eye-open"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                                    ></path>

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="3"
                                    ></circle>

                                </svg>


                                <svg
                                    class="password-eye-icon eye-closed"
                                    viewBox="0 0 24 24"
                                    aria-hidden="true"
                                >

                                    <path
                                        d="M3 3l18 18"
                                    ></path>

                                    <path
                                        d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                                    ></path>

                                    <path
                                        d="M9.9 4.2A11.8 11.8 0 0 1 12 4c6.5 0 10 6 10 6a18.5 18.5 0 0 1-3.1 3.8"
                                    ></path>

                                    <path
                                        d="M6.2 6.2C3.6 8.1 2 10 2 10s3.5 6 10 6c1.3 0 2.5-.2 3.6-.6"
                                    ></path>

                                </svg>

                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        id="resetPasswordButton"
                        class="btn-primary"
                    >
                        Reset Password
                    </button>


                    <p
                        id="resetPasswordMessage"
                        class="form-message"
                        aria-live="polite"
                    ></p>

                </form>

            </section>


            <!-- ========================================
                 FOOTER
            ========================================= -->

            <div
                class="login-footer"
                id="forgotPasswordFooter"
            >

                <button
                    type="button"
                    id="backToLoginButton"
                    class="btn-secondary"
                >
                    Back to Login
                </button>

            </div>

        </div>

    </main>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="./forgot-password.js"></script>

</body>

</html>
