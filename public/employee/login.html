<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Employee Login | Employee Task Management</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <main class="login-page">

        <div class="login-card">


            <!-- ========================================
                 ETM BRAND
            ========================================= -->

            <div class="login-brand">

                <div class="login-brand-logo">
                    ETM
                </div>

                <h2>
                    Employee Task Management
                </h2>

            </div>


            <!-- ========================================
                 LOGIN HEADER
            ========================================= -->

            <div class="login-header">

                <h1>
                    Employee Login
                </h1>

                <p>
                    Sign in to access your employee dashboard.
                </p>

            </div>


            <!-- ========================================
                 LOGIN FORM
            ========================================= -->

            <form id="employeeLoginForm">


                <!-- ========================================
                     EMAIL
                ========================================= -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- ========================================
                     PASSWORD
                ========================================= -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- ========================================
                     FORGOT PASSWORD
                ========================================= -->

                <div class="forgot-password-container">

                    <button
                        type="button"
                        id="forgotPasswordButton"
                        class="forgot-password-link"
                    >
                        Forgot Password?
                    </button>

                </div>


                <!-- ========================================
                     LOGIN BUTTON
                ========================================= -->

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Login
                </button>


                <!-- ========================================
                     LOGIN MESSAGE
                ======================================== -->

                <p
                    id="loginMessage"
                    class="form-message"
                ></p>


            </form>


            <!-- ========================================
                 BACK BUTTON
            ========================================= -->

            <div class="login-footer">

                <button
                    type="button"
                    id="backButton"
                    class="btn-secondary"
                >
                    Back
                </button>

            </div>


        </div>

    </main>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="../js/employee-login.js"></script>

</body>

</html>
